services:
  banco:
    image: postgres:16
    container_name: papelaria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - papelaria_dados:/var/lib/postgresql/data

volumes:
  papelaria_dados:
